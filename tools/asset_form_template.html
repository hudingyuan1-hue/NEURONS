<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEURONS · __TITLE__</title>
<style>
:root{font-family:system-ui,'Microsoft YaHei',sans-serif;color:#e4e1d4;background:#202a2e;color-scheme:dark}*{box-sizing:border-box}body{max-width:1200px;margin:auto;padding:24px}h1{font-size:28px}p{line-height:1.7}.notice{padding:12px;border-left:3px solid #d0ac76;background:#303b3e}nav{position:sticky;top:0;background:#202a2e;padding:12px 0;display:flex;flex-wrap:wrap;gap:8px;z-index:2}input,select,button,textarea{background:#344247;color:#eeeadd;border:1px solid #7b908d;padding:8px;font:inherit;border-radius:4px}button{cursor:pointer}button:hover{background:#4b6263}input[type=search]{flex:1}details{margin:12px 0;border:1px solid #667d7d;border-radius:5px}summary{padding:14px;cursor:pointer}article{padding:0 16px 16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}label{display:grid;gap:5px;font-size:13px}textarea{width:100%;min-height:72px}dl{display:grid;grid-template-columns:140px 1fr;line-height:1.65;gap:4px}dt{color:#a8c7bc}dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}code,pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.6 monospace}footer{display:flex;gap:14px;align-items:center}.error{color:#ffb9a5}a{color:#b9d7cd}#msg{min-height:28px}small{color:#bbcabd}
</style><h1>NEURONS · __TITLE__</h1><p class="notice">全游戏需求初表 · 纯2D固定斜俯视 · 稳定ID。原文要求、制作建议、待确认分开。数量是当前制作口径，台本候选不等于已批准录制。五选一已停用。美术缺失不阻塞功能开发。</p>
<p><a href="02_首批制作与交付.md">首批制作与交付</a> · <a href="data/art_requirements.json">美术JSON</a> · <a href="data/audio_requirements.json">音频JSON</a> · <a href="data/progress.json">仓库进度JSON</a> · <a href="history/01_全游戏提示词表单.html">旧美术表</a> · <a href="history/01_音频需求表.html">旧音频表</a></p>
<nav><input id="search" type="search" placeholder="ID / 人物 / 房间 / 事件"><select id="category"><option value="">全部类型</option></select><select id="batch"><option value="">全部批次</option></select><select id="scope"><option value="">全部范围</option></select><select id="status"><option value="">全部状态</option><option>待制作</option><option>制作中</option><option>已交付待验</option><option>已接入已测</option><option>需返修</option><option>停用</option></select><button id="import">导入进度/旧JSON</button><input id="file" type="file" accept=".json" hidden><button id="draft">恢复本机草稿</button><button id="connect">连接进度JSON</button><button id="save">保存到已连接文件</button><button id="export">导出进度JSON</button></nav><p id="msg" role="status">跨机前请保存或导出到data/progress.json；浏览器缓存不能代替仓库文件。</p><p id="stats"></p><main id="cards"></main><footer><button id="prev">上一页</button><span id="page"></span><button id="next">下一页</button></footer>
<script id="requirements" type="application/json">__DATA__</script><script id="progress" type="application/json">__PROGRESS__</script>
<script>
'use strict';
const payload=JSON.parse(document.getElementById('requirements').textContent),kind=payload.kind,rows=payload.rows,base=JSON.parse(document.getElementById('progress').textContent),$=id=>document.getElementById(id),fields=['status','file','license','notes'],pageSize=20;let page=0,handle=null,dirty=false;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function normalize(data){if(Array.isArray(data))return data;if(data&&Array.isArray(data[kind]))return data[kind];if(data&&data.kind===kind&&Array.isArray(data.rows))return data.rows;throw Error('JSON类型不匹配：需要进度对象、同类rows或旧数组');}
function merge(data){const list=normalize(data),map=new Map(rows.map(r=>[r.id,r])),seen=new Set();for(const x of list){if(!x||typeof x.id!=='string'||seen.has(x.id))throw Error('无效/重复ID');seen.add(x.id);}let count=0;for(const x of list){const r=map.get(x.id);if(!r)continue;for(const f of fields)if(typeof x[f]==='string')r[f]=x[f];count++;}if(!Array.isArray(data)&&data.kind==='progress'){for(const other of ['art','audio'])if(other!==kind&&Array.isArray(data[other]))base[other]=data[other];}return count;}
merge(base);let cachedDraft=null;try{cachedDraft=JSON.parse(localStorage.getItem('neurons-assets-v2-'+kind)||'null');if(cachedDraft)$('msg').textContent='检测到本机草稿，可手动恢复；跨机接手请先导入最新仓库进度。';}catch{}$('draft').disabled=!cachedDraft;$('draft').onclick=()=>{try{merge(cachedDraft);mark();render();}catch(e){$('msg').textContent=e.message;}};
function progress(){const result={...base,schema_version:2,kind:'progress',updated:new Date().toISOString()};result[kind]=rows.map(r=>Object.fromEntries(['id',...fields].map(f=>[f,r[f]||''])));return result;}
function mark(){dirty=true;try{localStorage.setItem('neurons-assets-v2-'+kind,JSON.stringify(progress()));}catch{}$('msg').textContent='有未同步修改；请保存到已连接文件，或导出并覆盖data/progress.json。';}
for(const field of ['category','batch','scope'])for(const value of [...new Set(rows.map(r=>r[field]))].sort()){const o=document.createElement('option');o.value=o.textContent=value;$(field).append(o);}
function visibleRows(){const q=$('search').value.toLowerCase();return rows.filter(r=>['category','batch','scope','status'].every(f=>!$(f).value||r[f]===$(f).value)&&(!q||JSON.stringify([r.id,r.name,r.scope,r.rooms,r.events]).toLowerCase().includes(q)));}
function render(){const found=visibleRows(),pages=Math.max(1,Math.ceil(found.length/pageSize));page=Math.min(page,pages-1);$('stats').textContent=`总${rows.length}项；匹配${found.length}项；${rows.filter(r=>r.status==='停用').length}项停用；${dirty?'有未同步进度':'未修改进度'}`;$('page').textContent=`${page+1} / ${pages}`;$('prev').disabled=page===0;$('next').disabled=page>=pages-1;$('cards').innerHTML=found.slice(page*pageSize,(page+1)*pageSize).map(r=>`<details><summary><strong>${esc(r.id)} · ${esc(r.name)}</strong><br><small>${esc(r.batch)} | ${esc(r.category)} | ${esc(r.scope)} | ${esc(r.status)}</small></summary><article><h3>制作描述</h3><p>${esc(r.description)}</p><dl>${['quantity','spec','filename','layers','sound_layers','performance_notes','reuse_scope','acceptance','source_details','reference_note','implementation_note','requirement','source','proposal','pending','alias_of','rooms','events','duration','loop','speaker','original_text','authorization','delivery'].filter(f=>r[f]).map(f=>`<dt>${esc(({quantity:'数量',spec:'规格',layers:'拆层与活动部件',sound_layers:'分轨与声音层',performance_notes:'演绎/声音要求',reuse_scope:'共用与复用范围',acceptance:'验收要点',source_details:'现行原文配置摘录',reference_note:'旧表内容候选（非创作定稿）',implementation_note:'接入触发说明',filename:'交付文件名',requirement:'原文/必要要求',source:'来源',proposal:'实现建议',pending:'待核验/待确认',alias_of:'复用稳定ID',rooms:'使用范围',events:'事件',duration:'时长',loop:'循环',speaker:'说话人',original_text:'原文台本',authorization:'授权记录要求',delivery:'工程操作与交付'})[f])}</dt><dd>${esc(r[f])}</dd>`).join('')}<dt>已有素材</dt><dd>${esc(r.existing_paths.join('\n')||'尚无已核验素材')}</dd></dl>${r.animation?`<h3>动画规格</h3><pre>${esc(JSON.stringify(r.animation,null,2))}</pre>`:''}<label>简短制作提示词（仅图像/声音）<textarea readonly>${esc(r.prompt)}</textarea></label><div class="grid">${fields.map(f=>`<label>${esc(({status:'进度状态',file:'实际交付仓库相对路径',license:'授权/作者/来源',notes:'制作备注/实测尺寸'})[f])}<textarea data-id="${esc(r.id)}" data-field="${f}">${esc(r[f])}</textarea></label>`).join('')}</div></article></details>`).join('');}
$('cards').addEventListener('input',e=>{const t=e.target;if(!t.dataset.id)return;rows.find(r=>r.id===t.dataset.id)[t.dataset.field]=t.value;mark();});
for(const field of ['search','category','batch','scope','status'])$(field).addEventListener('input',()=>{page=0;render();});$('prev').onclick=()=>{page--;render();};$('next').onclick=()=>{page++;render();};
$('import').onclick=()=>$('file').click();$('file').onchange=async()=>{try{const f=$('file').files[0];if(!f)return;const n=merge(JSON.parse(await f.text()));mark();render();$('msg').textContent=`已合并${n}个稳定ID；请保存同步。`;}catch(e){$('msg').textContent=e.message;}};
$('connect').onclick=async()=>{try{if(!window.showOpenFilePicker)throw Error('此浏览器不支持直接写文件，请使用导入/导出');const picked=await showOpenFilePicker({multiple:false,types:[{description:'进度JSON',accept:{'application/json':['.json']}}]});const proposed=picked[0],data=JSON.parse(await (await proposed.getFile()).text());if(data.kind!=='progress'||data.schema_version!==2||!Array.isArray(data.art)||!Array.isArray(data.audio))throw Error('只能连接v2 progress.json；旧表/需求JSON请用导入，不能覆盖');merge(data);handle=proposed;render();$('msg').textContent='已连接；修改后点击保存。';}catch(e){$('msg').textContent=e.message;}};
$('save').onclick=async()=>{try{if(!handle)throw Error('先连接data/progress.json，或使用导出');const latest=JSON.parse(await (await handle.getFile()).text());if(latest.kind!=='progress'||latest.schema_version!==2)throw Error('已连接文件类型改变，已停止写入');const other=kind==='art'?'audio':'art';if(!Array.isArray(latest[other]))throw Error('另一类进度无效，已停止写入');base[other]=latest[other];const w=await handle.createWritable();await w.write(JSON.stringify(progress(),null,2));await w.close();dirty=false;render();$('msg').textContent='进度已写入已连接JSON；Git提交由你完成。';}catch(e){$('msg').textContent=e.message;}};
$('export').onclick=()=>{const blob=new Blob([JSON.stringify(progress(),null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);$('msg').textContent='已下载；请覆盖仓库data/progress.json后Commit/Push，下载不等于已同步。';};render();
</script></html>
