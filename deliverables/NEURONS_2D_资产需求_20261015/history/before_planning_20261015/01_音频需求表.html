for(const field of ['category','batch','scope'])for(const value of [...new Set(rows.map(r=>r[field]))].sort()){const o=document.createElement('option');o.value=o.textContent=value;$(field).append(o);}
function visibleRows(){const q=$('search').value.toLowerCase();return rows.filter(r=>['category','batch','scope','status'].every(f=>!$(f).value||r[f]===$(f).value)&&(!q||JSON.stringify([r.id,r.name,r.scope,r.rooms,r.events]).toLowerCase().includes(q)));}
function render(){const found=visibleRows(),pages=Math.max(1,Math.ceil(found.length/pageSize));page=Math.min(page,pages-1);$('stats').textContent=`总${rows.length}项；匹配${found.length}项；${rows.filter(r=>r.status==='停用').length}项停用；${dirty?'有未同步进度':'未修改进度'}`;$('page').textContent=`${page+1} / ${pages}`;$('prev').disabled=page===0;$('next').disabled=page>=pages-1;$('cards').innerHTML=found.slice(page*pageSize,(page+1)*pageSize).map(r=>`<details><summary><strong>${esc(r.id)} · ${esc(r.name)}</strong><br><small>${esc(r.batch)} | ${esc(r.category)} | ${esc(r.scope)} | ${esc(r.status)}</small></summary><article><h3>制作描述</h3><p>${esc(r.description)}</p><dl>${['quantity','spec','filename','layers','sound_layers','performance_notes','reuse_scope','acceptance','source_details','reference_note','implementation_note','requirement','source','proposal','pending','alias_of','rooms','events','duration','loop','speaker','original_text','authorization','delivery'].filter(f=>r[f]).map(f=>`<dt>${esc(({quantity:'数量',spec:'规格',layers:'拆层与活动部件',sound_layers:'分轨与声音层',performance_notes:'演绎/声音要求',reuse_scope:'共用与复用范围',acceptance:'验收要点',source_details:'现行原文配置摘录',reference_note:'旧表内容候选（非创作定稿）',implementation_note:'接入触发说明',filename:'交付文件名',requirement:'原文/必要要求',source:'来源',proposal:'实现建议',pending:'待核验/待确认',alias_of:'复用稳定ID',rooms:'使用范围',events:'事件',duration:'时长',loop:'循环',speaker:'说话人',original_text:'原文台本',authorization:'授权记录要求',delivery:'工程操作与交付'})[f])}</dt><dd>${esc(r[f])}</dd>`).join('')}<dt>已有素材</dt><dd>${esc(r.existing_paths.join('\n')||'尚无已核验素材')}</dd></dl>${r.animation?`<h3>动画规格</h3><pre>${esc(JSON.stringify(r.animation,null,2))}</pre>`:''}<label>简短制作提示词（仅图像/声音）<textarea readonly>${esc(r.prompt)}</textarea></label><div class="grid">${fields.map(f=>`<label>${esc(({status:'进度状态',file:'实际交付仓库相对路径',license:'授权/作者/来源',notes:'制作备注/实测尺寸'})[f])}<textarea data-id="${esc(r.id)}" data-field="${f}">${esc(r[f])}</textarea></label>`).join('')}</div></article></details>`).join('');}
$('cards').addEventListener('input',e=>{const t=e.target;if(!t.dataset.id)return;rows.find(r=>r.id===t.dataset.id)[t.dataset.field]=t.value;mark();});
for(const field of ['search','category','batch','scope','status'])$(field).addEventListener('input',()=>{page=0;render();});$('prev').onclick=()=>{page--;render();};$('next').onclick=()=>{page++;render();};
$('import').onclick=()=>$('file').click();$('file').onchange=async()=>{try{const f=$('file').files[0];if(!f)return;const n=merge(JSON.parse(await f.text()));mark();render();$('msg').textContent=`已合并${n}个稳定ID；请保存同步。`;}catch(e){$('msg').textContent=e.message;}};
$('connect').onclick=async()=>{try{if(!window.showOpenFilePicker)throw Error('此浏览器不支持直接写文件，请使用导入/导出');const picked=await showOpenFilePicker({multiple:false,types:[{description:'进度JSON',accept:{'application/json':['.json']}}]});const proposed=picked[0],data=JSON.parse(await (await proposed.getFile()).text());if(data.kind!=='progress'||data.schema_version!==2||!Array.isArray(data.art)||!Array.isArray(data.audio))throw Error('只能连接v2 progress.json；旧表/需求JSON请用导入，不能覆盖');merge(data);handle=proposed;render();$('msg').textContent='已连接；修改后点击保存。';}catch(e){$('msg').textContent=e.message;}};
$('save').onclick=async()=>{try{if(!handle)throw Error('先连接data/progress.json，或使用导出');const latest=JSON.parse(await (await handle.getFile()).text());if(latest.kind!=='progress'||latest.schema_version!==2)throw Error('已连接文件类型改变，已停止写入');const other=kind==='art'?'audio':'art';if(!Array.isArray(latest[other]))throw Error('另一类进度无效，已停止写入');base[other]=latest[other];const w=await handle.createWritable();await w.write(JSON.stringify(progress(),null,2));await w.close();dirty=false;render();$('msg').textContent='进度已写入已连接JSON；Git提交由你完成。';}catch(e){$('msg').textContent=e.message;}};
$('export').onclick=()=>{const blob=new Blob([JSON.stringify(progress(),null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);$('msg').textContent='已下载；请覆盖仓库data/progress.json后Commit/Push，下载不等于已同步。';};render();
</script></html>
